<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akasha Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    // Applied before first paint so a saved theme doesn't flash the wrong one.
    try {
      var t = localStorage.getItem("akasha-theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body>

  <div class="boot" id="boot"></div>
  <div class="wrap" id="app"></div>

  <noscript>
    <p style="font-family:sans-serif;padding:24px;">
      Akasha Terminal renders its content with JavaScript. Enable it to view the dashboard.
    </p>
  </noscript>

  <script src="data.js"></script>
  <script src="wishes-sync.js"></script>
  <script src="script.js"></script>
</body>
</html>
